[package]
name = "mpc-wallet-loader"
version = "0.1.0"
edition = "2021"
description = "Reference Rust client demonstrating Shamir threshold reconstruction and ethers-rs integration for open-mpc-vault"
license = "MIT"

[dependencies]
anyhow = "1.0"
ethers-core = "2.0"
ethers-signers = "2.0"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt-multi-thread"] }
